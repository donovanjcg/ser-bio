<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ser Café | Café Premium Colombiano</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="Img/logoSC-10.png" type="image/png">
</head>
<body>
    <header>
        <a href="index.html">
            <img class="logoletra logoheader" src="Img/logoSC-letra-02.png" alt="logo">
        </a>
        <nav>
            <ul>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="perfil.html">Perfil de SerCafé</a></li>
                <li><a href="contactanos.html">Contáctanos</a></li>
            </ul>
        </nav>
        <button class="btn-tienda" onclick="window.location.href='tienda.html'">
            🛒 Comprar Café
        </button>
    </header>

    <div class="contenedor3c">
        <img class="tiendaimg2" src="Img/perfil.png" alt="Perfil">
        <img class="tiendaimg2" src="Img/250gr.png" alt="250 gramos">
        <div class="tiendaimg21">
            <img class="tiendaimg3" src="Img/Compra_250.png" alt="descripcion">
            <div class="botones">
                <button class="boton" onclick="seleccionarMolienda(this)">Fina</button>
                <button class="boton" onclick="seleccionarMolienda(this)">Gruesa</button>
                <button class="boton" onclick="seleccionarMolienda(this)">Grano</button>
                <button class="boton" onclick="seleccionarMolienda(this)">Media</button>
            </div>

            <h3>Ubicación</h3>
            
            <div class="botones">
                <select class="boton" id="departamento" onchange="cargarMunicipios(); calcularTotal('250')">
                    <option value="">departamento</option>
                    <option value="Antioquia">Antioquia</option>
                    <option value="Otro">Resto del pais</option>
                </select>

                <select class="boton" id="municipio" onchange="calcularTotal('250')">
                </select>
            </div>

            <h3>Cantidad</h3>
            <button class="boton2" onclick="disminuir(); calcularTotal('250')">-</button>
            <span class="tiendaletra3" id="cantidad">1</span>
            <button class="boton2" onclick="aumentar() ; calcularTotal('250')">+</button>
            
            <div class="resumen">
                <div class="fila">
                    <div class="item">
                        <span class="label">Envío</span>
                        <span class="valor pequeno" id="envio">$0</span>
                    </div>

                    <div class="item">
                        <span class="label">Producto</span>
                        <span class="valor pequeno" id="total">$23.000</span>
                    </div>
                </div>

                <div class="total">
                    <span class="label-total">Total a pagar</span>
                    <span class="valor grande" id="totalpagar">$23.000</span>
                </div>
            </div>

            <button id="botonpago" class="boton" onclick="calcularboton('250')">Calcular pago</button>

            <form>
                <div id="epayco-button-container"></div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
