<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ser Café | Café Premium Colombiano</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="Img/logoSC-10.png" type="image/png">
</head>
<body>
    <header>
        <a href="index.html">
            <img class="logoletra logoheader" src="Img/logoSC-letra-02.png" alt="logo">
        </a>
        <nav>
            <ul>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="perfil.html">Perfil de SerCafé</a></li>
                <li><a href="contactanos.html">Contáctanos</a></li>
            </ul>
        </nav>
        <button class="btn-tienda">
            <a href="tienda.html" >🛒 Comprar Café</a>
        </button>
    </header>

    <div class="contenedor3c">
        <img class="tiendaimg2" src="Img/perfil.png" alt="Perfil">
        <img class="tiendaimg2" src="Img/250gr.png" alt="250 gramos">
        <div class="tiendaimg21">
            <img class="tiendaimg3" src="Img/Compra.png" alt="descripcion">
            <div class="botones">
                <button class="boton" onclick="seleccionarMolienda(this)">Fina</button>
                <button class="boton" onclick="seleccionarMolienda(this)">Gruesa</button>
                <button class="boton" onclick="seleccionarMolienda(this)">Grano</button>
                <button class="boton" onclick="seleccionarMolienda(this)">Media</button>
            </div>

            <h3>Ubicación</h3>
            
            <div class="botones">
                <select class="boton" id="departamento" onchange="cargarMunicipios(); calcularTotal('media_libra')">
                    <option value="">departamento</option>
                    <option value="Antioquia">Antioquia</option>
                    <option value="Otro">Resto del pais</option>
                </select>

                <select class="boton" id="municipio" onchange="calcularTotal('media_libra')">
                </select>
            </div>

            <h3>Cantidad</h3>
            <button class="boton2" onclick="disminuir(); calcularTotal('media_libra')">-</button>
            <span class="tiendaletra3" id="cantidad">1</span>
            <button class="boton2" onclick="aumentar() ; calcularTotal('media_libra')">+</button>
            
            <div class="resumen">
                <div class="resumen-item">
                    <h3>Envío</h3>
                    <h2 class="valor" id="envio">$0</h2>
                </div>
                <div class="resumen-item">
                    <h3>Producto</h3>
                    <h2 class="valor" id="total">$23.000</h2>
                </div>
            </div>  

            <h3>Total a Pagar</h3>
            <h2 class="valor-total" id="totalpagar">$23.000</h2>

            <button id="botonpago" class="boton" onclick="calcularboton()">Calcular pago</button>

            <form>
                <div id="epayco-button-container"></div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
